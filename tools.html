<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Visual Thinking Toolkit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&family=Roboto:wght@400;500;700&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/icon?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet">
<style>
:root{
  --md-primary:#1a73e8;
  --md-on-primary:#ffffff;
  --md-primary-container:#d3e3fd;
  --md-on-primary-container:#041e49;
  --md-secondary:#5f6368;
  --md-surface:#ffffff;
  --md-surface-variant:#f8f9fa;
  --md-surface-dim:#f1f3f4;
  --md-on-surface:#1f1f1f;
  --md-on-surface-variant:#444746;
  --md-outline:#dadce0;
  --md-outline-variant:#c4c7c5;
  --md-error:#d93025;
  --md-elev-1:0 1px 2px rgba(60,64,67,.3), 0 1px 3px 1px rgba(60,64,67,.15);
  --md-elev-2:0 1px 2px rgba(60,64,67,.3), 0 2px 6px 2px rgba(60,64,67,.15);
  --md-elev-3:0 4px 8px 3px rgba(60,64,67,.15), 0 1px 3px rgba(60,64,67,.3);
  --radius-sm:8px; --radius-md:12px; --radius-lg:16px; --radius-xl:24px; --radius-full:999px;
  --sidebar-w:290px;
}

[data-theme="dark"]{
  --md-primary:#a8c7fa;
  --md-on-primary:#062e6f;
  --md-primary-container:#0842a0;
  --md-on-primary-container:#d3e3fd;
  --md-secondary:#8e918f;
  --md-surface:#1e1f20;
  --md-surface-variant:#131314;
  --md-surface-dim:#282a2c;
  --md-on-surface:#e3e3e3;
  --md-on-surface-variant:#c4c7c5;
  --md-outline:#444746;
  --md-outline-variant:#303030;
  --md-elev-1:0 1px 3px rgba(0,0,0,.4), 0 1px 2px rgba(0,0,0,.3);
  --md-elev-2:0 2px 6px rgba(0,0,0,.4), 0 1px 2px rgba(0,0,0,.3);
  --md-elev-3:0 4px 12px rgba(0,0,0,.5), 0 2px 4px rgba(0,0,0,.3);
}

*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  font-family:'Google Sans','Roboto',system-ui,sans-serif;
  background:var(--md-surface-variant);
  color:var(--md-on-surface);
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
  display:flex;
  transition:background-color .2s ease, color .2s ease;
}
.material-symbols-rounded{font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24;vertical-align:middle}

/* ============ MOBILE TOPBAR ============ */
.mobile-topbar{
  display:none;
  position:sticky; top:0; z-index:90;
  background:var(--md-surface);
  border-bottom:1px solid var(--md-outline);
  padding:10px 16px; align-items:center; justify-content:space-between;
}
.menu-btn, .theme-toggle-btn{
  background:transparent; border:0; cursor:pointer;
  width:38px; height:38px; border-radius:var(--radius-full);
  display:grid; place-items:center; color:var(--md-on-surface-variant);
  transition:background .15s, color .15s;
}
.menu-btn:hover, .theme-toggle-btn:hover{background:var(--md-surface-dim); color:var(--md-on-surface)}

/* ============ LEFT SIDEBAR ============ */
.left-sidebar{
  width:var(--sidebar-w); height:100vh;
  position:sticky; top:0; z-index:100;
  background:var(--md-surface);
  border-right:1px solid var(--md-outline);
  display:flex; flex-direction:column;
  flex-shrink:0;
  transition:background-color .2s ease, border-color .2s ease;
}
.sidebar-header{
  padding:16px 16px 12px 20px;
  display:flex; align-items:center; justify-content:space-between;
}
.sidebar-logo{
  display:flex; align-items:center; gap:10px;
  text-decoration:none; color:var(--md-on-surface);
}
.logo-mark{
  width:32px; height:32px; border-radius:8px;
  background:linear-gradient(135deg,#4285f4,#34a853,#fbbc04,#ea4335);
  display:grid; place-items:center; color:#fff; font-weight:700; font-size:16px;
}
.logo-text{display:flex; flex-direction:column; line-height:1.2}
.brand-title{font-weight:500; font-size:16px}
.brand-sub{font-size:11px; color:var(--md-on-surface-variant)}

.sidebar-search{
  padding:4px 16px 12px;
}
.search-bar{
  display:flex; align-items:center; gap:8px;
  background:var(--md-surface-variant);
  border:1px solid var(--md-outline);
  border-radius:var(--radius-full);
  padding:6px 12px;
  transition:box-shadow .2s, border-color .2s, background .2s;
}
.search-bar:focus-within{
  background:var(--md-surface);
  border-color:var(--md-primary);
  box-shadow:0 0 0 2px var(--md-primary-container);
}
.search-bar .material-symbols-rounded{color:var(--md-on-surface-variant); font-size:18px}
.search-bar input{
  flex:1; border:0; outline:0; background:transparent;
  font:500 13.5px 'Google Sans',sans-serif; color:var(--md-on-surface);
}
.search-bar input::placeholder{color:var(--md-on-surface-variant)}
.search-clear{
  background:transparent; border:0; cursor:pointer; padding:2px;
  border-radius:var(--radius-full); display:none;
}
.search-clear:hover{background:var(--md-surface-dim)}
.search-clear.show{display:block}

.sidebar-scrollable{
  flex:1; overflow-y:auto; padding:0 12px 24px;
  display:flex; flex-direction:column; gap:16px;
  scrollbar-width:thin; scrollbar-color:var(--md-outline) transparent;
}
.sidebar-scrollable::-webkit-scrollbar{width:5px}
.sidebar-scrollable::-webkit-scrollbar-thumb{background:var(--md-outline); border-radius:3px}

.sidebar-section{display:flex; flex-direction:column; gap:6px}
.section-header{
  display:flex; justify-content:space-between; align-items:center;
  padding:0 4px;
}
.section-title{
  font:500 11px 'Google Sans'; text-transform:uppercase; letter-spacing:.6px;
  color:var(--md-on-surface-variant);
}
.reset-btn{
  background:transparent; border:0; cursor:pointer;
  font:500 11px 'Google Sans'; color:var(--md-primary);
  padding:2px 4px; border-radius:4px;
}
.reset-btn:hover{background:var(--md-primary-container)}

.add-json-btn{
  display:flex; align-items:center; justify-content:center; gap:8px;
  width:100%; padding:8px 12px; border-radius:var(--radius-md);
  background:var(--md-primary-container); border:1px solid transparent;
  color:var(--md-on-primary-container); font:500 12.5px 'Google Sans';
  cursor:pointer; transition:all .15s ease;
}
.add-json-btn:hover{
  background:var(--md-primary); color:var(--md-on-primary);
  box-shadow:var(--md-elev-1);
}
.add-json-btn .material-symbols-rounded{font-size:18px}

/* Nav Items & Category Items in Left Sidebar */
.nav-list, .category-list{display:flex; flex-direction:column; gap:2px}
.nav-item, .cat-item{
  display:flex; align-items:center; gap:10px;
  padding:7px 10px; border-radius:var(--radius-md);
  border:1px solid transparent; background:transparent;
  cursor:pointer; text-align:left; width:100%;
  font:500 13px 'Google Sans'; color:var(--md-on-surface);
  transition:all .15s;
}
.nav-item:hover, .cat-item:hover{background:var(--md-surface-dim)}
.nav-item.active{
  background:var(--md-primary-container);
  color:var(--md-on-primary-container);
  font-weight:700;
}
.nav-item .material-symbols-rounded{font-size:18px; color:var(--md-on-surface-variant)}
.nav-item.active .material-symbols-rounded{color:var(--md-primary); font-variation-settings:'FILL' 1}
.item-label{flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.item-badge, .cat-item .count{
  font-size:11px; padding:1px 6px; border-radius:var(--radius-full);
  background:var(--md-surface-dim); color:var(--md-on-surface-variant);
}
.nav-item.active .item-badge{
  background:var(--md-primary); color:var(--md-on-primary);
}

.cat-item.active{
  background:var(--cat-tint, #e8f0fe);
  border-color:var(--cat-color, var(--md-primary));
  color:var(--cat-color, var(--md-primary));
  font-weight:700;
}
[data-theme="dark"] .cat-item.active{
  background:rgba(255,255,255,.08);
}
.cat-item .dot{width:9px; height:9px; border-radius:50%; background:var(--c); flex-shrink:0}
.cat-item.active .count{
  background:var(--cat-color, var(--md-primary)); color:#fff;
}

/* Stage List */
.stage-list{display:grid; grid-template-columns:repeat(2, 1fr); gap:4px}
.stage-chip{
  display:inline-flex; align-items:center; gap:6px;
  padding:5px 7px; border-radius:var(--radius-sm);
  border:1px solid var(--md-outline); background:var(--md-surface-variant);
  cursor:pointer; font:500 11.5px 'Google Sans'; color:var(--md-on-surface-variant);
  transition:all .15s; text-align:left;
}
.stage-chip:hover{background:var(--md-surface-dim); color:var(--md-on-surface)}
.stage-chip.active{
  background:var(--md-primary-container);
  border-color:var(--md-primary);
  color:var(--md-on-primary-container);
  font-weight:700;
}
.stage-chip b{
  font-size:9.5px; width:16px; height:16px; border-radius:50%;
  background:var(--md-surface); color:var(--md-on-surface);
  display:grid; place-items:center; flex-shrink:0;
}
.stage-chip.active b{background:var(--md-primary); color:var(--md-on-primary)}

/* Bookmarks Quick List */
.bookmarks-list{display:flex; flex-direction:column; gap:2px}
.b-quick-item{
  display:flex; align-items:center; gap:8px;
  padding:6px 8px; border-radius:var(--radius-sm);
  cursor:pointer; font:500 12px 'Google Sans'; color:var(--md-on-surface);
  transition:background .15s;
}
.b-quick-item:hover{background:var(--md-surface-dim)}
.b-quick-item i{width:7px; height:7px; border-radius:50%; background:var(--c); flex-shrink:0}
.b-quick-item .b-name{flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.b-empty{font-size:12px; color:var(--md-on-surface-variant); padding:6px 8px; font-style:italic}

/* ============ MAIN CONTENT AREA ============ */
.app-main{
  flex:1; min-width:0;
  display:flex; flex-direction:column;
}

.hero{
  padding:28px 32px 12px;
}
.hero h1{
  font-family:'Google Sans'; font-weight:500;
  font-size:clamp(26px,3vw,34px); color:var(--md-on-surface);
  line-height:1.2; margin-bottom:6px;
}
.hero h1 em{
  font-style:normal;
  background:linear-gradient(120deg,#4285f4,#34a853 40%,#fbbc04 70%,#ea4335);
  -webkit-background-clip:text; background-clip:text; color:transparent;
}
.hero p{color:var(--md-on-surface-variant); font-size:14px; max-width:760px; line-height:1.5}

.main-content{padding:12px 32px 60px}

.meta-header{
  display:flex; justify-content:space-between; align-items:center;
  margin-bottom:16px; color:var(--md-on-surface-variant); font-size:13px;
}
.filter-summary{display:flex; align-items:center; gap:8px; flex-wrap:wrap}
.active-tag{
  display:inline-flex; align-items:center; gap:4px;
  padding:3px 10px; border-radius:var(--radius-full);
  background:var(--md-primary-container); color:var(--md-on-primary-container);
  font:500 12px 'Google Sans';
}
.active-tag .material-symbols-rounded{font-size:14px; cursor:pointer}

/* ============ GRID & CARD HOVER REVEAL ============ */
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(310px,1fr));
  gap:16px;
  align-items:start;
}
.card{
  background:var(--md-surface);
  border:1px solid var(--md-outline);
  border-radius:var(--radius-lg);
  overflow:hidden;
  display:flex; flex-direction:column;
  transition:box-shadow .25s ease, transform .25s ease, background-color .2s;
  cursor:default;
}
.card:hover{
  box-shadow:var(--md-elev-3);
  transform:translateY(-2px);
}
.card.flash{animation:flash .8s ease}
@keyframes flash{
  0%,100%{box-shadow:none}
  50%{box-shadow:0 0 0 3px var(--md-primary-container), var(--md-elev-2)}
}

.media{
  position:relative; height:180px;
  background:var(--c,#e8eaed);
  overflow:hidden;
  cursor:pointer;
}
.media img{width:100%; height:100%; object-fit:cover; display:block; transition:transform .35s ease}
.card:hover .media img{transform:scale(1.04)}

.cat-tag{
  position:absolute; top:12px; left:12px;
  background:rgba(255,255,255,.95);
  backdrop-filter:blur(8px);
  padding:4px 10px; border-radius:var(--radius-full);
  font:500 11px 'Google Sans'; color:#202124;
  display:flex; align-items:center; gap:6px;
}
[data-theme="dark"] .cat-tag{
  background:rgba(30,31,32,.9); color:#e3e3e3;
}
.cat-tag i{width:8px; height:8px; border-radius:50%; background:var(--c)}

.view-pill{
  position:absolute; bottom:10px; right:10px;
  background:rgba(0,0,0,.7); color:#fff;
  backdrop-filter:blur(6px);
  font:500 11px 'Google Sans';
  padding:3px 8px; border-radius:var(--radius-full);
  display:inline-flex; align-items:center; gap:4px;
  opacity:0; transform:translateY(4px); transition:all .2s;
}
.view-pill .material-symbols-rounded{font-size:14px}
.card:hover .view-pill{opacity:1; transform:none}

.body{
  padding:14px 16px; flex:1;
  display:flex; flex-direction:column;
  cursor:pointer;
}
.trow{
  display:flex; justify-content:space-between;
  align-items:center; gap:10px;
}
.card h3{font:500 16px 'Google Sans'; color:var(--md-on-surface); line-height:1.3}
.stage-badge{
  flex-shrink:0;
  background:var(--primary-tint,#e8f0fe);
  color:var(--md-primary);
  padding:3px 9px; border-radius:var(--radius-full);
  font:500 11px 'Google Sans'; white-space:nowrap;
}
[data-theme="dark"] .stage-badge{
  background:rgba(255,255,255,.08);
}

/* Hover Preview: Hidden by default, smoothly expands on hover */
.card-hover-preview{
  max-height:0;
  opacity:0;
  overflow:hidden;
  transform:translateY(-4px);
  transition:max-height .35s cubic-bezier(.4,0,.2,1), opacity .25s ease, transform .25s ease, margin .25s ease;
}
.card:hover .card-hover-preview,
.card:focus-within .card-hover-preview{
  max-height:500px;
  opacity:1;
  transform:translateY(0);
  margin-top:12px;
}

.purpose{color:var(--md-on-surface-variant); font-size:13px; line-height:1.5; margin-bottom:12px}

.meta{
  display:grid; grid-template-columns:1fr 1fr; gap:8px;
  margin-bottom:12px;
}
.meta > div{
  background:var(--md-surface-variant);
  padding:8px 10px; border-radius:var(--radius-md);
}
.meta dt{
  font:500 9.5px 'Google Sans'; text-transform:uppercase;
  letter-spacing:.5px; color:var(--md-on-surface-variant);
  margin-bottom:2px;
}
.meta dd{font-size:12px; color:var(--md-on-surface); line-height:1.35}
.meta .wide{grid-column:1/-1}

.example{
  background:var(--md-surface-variant);
  border-left:3px solid var(--md-primary);
  padding:9px 11px; border-radius:0 var(--radius-md) var(--radius-md) 0;
  font-size:12px; color:var(--md-on-surface); line-height:1.45;
}
.example b{
  color:var(--md-primary); font:500 9.5px 'Google Sans';
  text-transform:uppercase; letter-spacing:.5px;
  display:block; margin-bottom:3px;
}

.actions{
  display:flex; border-top:1px solid var(--md-outline);
  margin-top:auto;
}
.act-btn{
  flex:1; background:transparent; border:0; cursor:pointer;
  padding:9px 6px; font:500 12px 'Google Sans';
  color:var(--md-on-surface-variant);
  display:flex; align-items:center; justify-content:center; gap:4px;
  transition:background .15s, color .15s;
}
.act-btn:hover{background:var(--md-surface-variant); color:var(--md-on-surface)}
.act-btn:not(:last-child){border-right:1px solid var(--md-outline)}
.act-btn .material-symbols-rounded{font-size:16px}
.act-btn.faved{color:#f9ab00}
.act-btn.faved .material-symbols-rounded{font-variation-settings:'FILL' 1}
.act-btn.marked{color:var(--md-primary)}
.act-btn.marked .material-symbols-rounded{font-variation-settings:'FILL' 1}
.act-btn.edit-btn{color:var(--md-on-surface-variant)}
.act-btn.edit-btn:hover{color:var(--md-primary)}
.act-btn.details-btn{color:var(--md-primary)}

.empty{
  display:none; text-align:center; padding:80px 20px;
  color:var(--md-on-surface-variant);
}
.empty .material-symbols-rounded{font-size:64px; color:var(--md-outline); margin-bottom:12px}
.empty h3{font:500 20px 'Google Sans'; color:var(--md-on-surface); margin-bottom:6px}

/* ============ MODALS SHARED ============ */
.modal-backdrop{
  position:fixed; inset:0; background:rgba(0,0,0,.6);
  backdrop-filter:blur(4px);
  z-index:200; opacity:0; pointer-events:none;
  transition:opacity .25s ease;
  display:flex; align-items:center; justify-content:center;
  padding:20px;
}
.modal-backdrop.open{opacity:1; pointer-events:auto}

.modal-dialog{
  background:var(--md-surface);
  border:1px solid var(--md-outline);
  border-radius:var(--radius-xl);
  width:min(740px, 100%); max-height:min(90vh, 860px);
  box-shadow:var(--md-elev-3);
  display:flex; flex-direction:column;
  overflow:hidden;
  transform:scale(.95); transition:transform .25s cubic-bezier(.2,0,0,1);
}
.modal-backdrop.open .modal-dialog{transform:none}

.modal-header{
  padding:16px 24px; border-bottom:1px solid var(--md-outline);
  display:flex; align-items:center; justify-content:space-between;
}
.modal-header-meta{display:flex; align-items:center; gap:8px}
.modal-cat-tag{
  padding:4px 10px; border-radius:var(--radius-full);
  background:var(--md-surface-variant); font:500 12px 'Google Sans';
  display:inline-flex; align-items:center; gap:6px;
}
.modal-cat-tag i{width:8px; height:8px; border-radius:50%; background:currentColor}
.modal-stage-badge{
  padding:4px 10px; border-radius:var(--radius-full);
  font:500 12px 'Google Sans'; background:var(--md-primary-container); color:var(--md-on-primary-container);
}
.modal-close-btn{
  width:36px; height:36px; border-radius:var(--radius-full);
  background:transparent; border:0; cursor:pointer;
  display:grid; place-items:center; color:var(--md-on-surface-variant);
  transition:background .15s, color .15s;
}
.modal-close-btn:hover{background:var(--md-surface-dim); color:var(--md-on-surface)}

.modal-body{
  padding:24px; overflow-y:auto;
  display:flex; flex-direction:column; gap:24px;
}

.modal-section{display:flex; flex-direction:column; gap:12px}
.section-heading{
  display:flex; align-items:center; gap:8px;
  color:var(--md-on-surface);
}
.section-heading .material-symbols-rounded{font-size:20px; color:var(--md-primary)}
.section-heading h3{font:500 15px 'Google Sans'}

/* Details Modal Specifics */
.tool-title-row{display:flex; align-items:center; gap:10px; margin-bottom:10px}
.tool-emoji{font-size:28px}
.tool-title-row h2{font:500 clamp(22px,3vw,28px) 'Google Sans'; color:var(--md-on-surface); line-height:1.2}

.definition-highlight{
  background:var(--md-surface-variant); border-left:4px solid var(--md-primary);
  border-radius:0 var(--radius-md) var(--radius-md) 0;
  padding:14px 16px; margin-bottom:12px;
}
.def-badge{
  font:500 10.5px 'Google Sans'; color:var(--md-primary);
  text-transform:uppercase; letter-spacing:.6px; display:block; margin-bottom:4px;
}
.modal-definition-text{font-size:15px; color:var(--md-on-surface); line-height:1.6}

.specs-grid{
  display:grid; grid-template-columns:1fr 1fr; gap:10px;
}
.spec-card{
  background:var(--md-surface-variant); border:1px solid var(--md-outline-variant);
  border-radius:var(--radius-md); padding:10px 14px;
  display:flex; flex-direction:column; gap:4px;
}
.spec-card.wide{grid-column:1/-1}
.spec-label{
  display:flex; align-items:center; gap:6px;
  font:500 10.5px 'Google Sans'; color:var(--md-on-surface-variant);
  text-transform:uppercase; letter-spacing:.5px;
}
.spec-label .material-symbols-rounded{font-size:15px; color:var(--md-primary)}
.spec-value{font-size:13px; color:var(--md-on-surface); line-height:1.4}

.visual-media-box{
  border:1px solid var(--md-outline); border-radius:var(--radius-md);
  overflow:hidden; background:var(--md-surface-variant);
}
.modal-media{
  position:relative; height:240px; background:#e8eaed;
  overflow:hidden;
}
.modal-media img{width:100%; height:100%; object-fit:cover; display:block}
.visual-example-details{
  padding:12px 16px; border-top:1px solid var(--md-outline);
  background:var(--md-surface);
}
.example-tag{
  font:500 10.5px 'Google Sans'; color:var(--md-primary);
  text-transform:uppercase; letter-spacing:.5px; display:block; margin-bottom:4px;
}
.example-text{font-size:13px; color:var(--md-on-surface); line-height:1.5}

.prompts-sub{font-size:13px; color:var(--md-on-surface-variant); margin-top:-6px}
.prompts-container{display:flex; flex-direction:column; gap:12px}
.prompt-card{
  background:var(--md-surface-variant); border:1px solid var(--md-outline);
  border-radius:var(--radius-md); overflow:hidden;
}
.prompt-header{
  padding:8px 12px; background:var(--md-surface);
  border-bottom:1px solid var(--md-outline-variant);
  display:flex; align-items:center; justify-content:space-between;
}
.prompt-type-badge{
  font:500 12px 'Google Sans'; color:var(--md-on-surface);
  display:inline-flex; align-items:center; gap:6px;
}
.prompt-type-badge .material-symbols-rounded{font-size:16px; color:var(--md-primary)}
.copy-prompt-btn{
  background:var(--md-surface-variant); border:1px solid var(--md-outline);
  border-radius:var(--radius-full); padding:4px 10px;
  font:500 11.5px 'Google Sans'; color:var(--md-on-surface);
  cursor:pointer; display:inline-flex; align-items:center; gap:4px;
  transition:all .15s;
}
.copy-prompt-btn:hover{background:var(--md-surface-dim)}
.copy-prompt-btn .material-symbols-rounded{font-size:14px}
.copy-prompt-btn.copied{
  background:var(--md-primary); color:var(--md-on-primary); border-color:var(--md-primary);
}

.prompt-code{
  padding:12px 14px; font-family:'Roboto Mono',monospace;
  font-size:12px; color:var(--md-on-surface); line-height:1.55;
  white-space:pre-wrap; word-break:break-word;
}

/* Modal Footers */
.modal-footer{
  padding:12px 24px; border-top:1px solid var(--md-outline);
  display:flex; align-items:center; justify-content:space-between;
  background:var(--md-surface);
}
.modal-footer-left{display:flex; align-items:center; gap:8px}
.modal-act-btn{
  background:var(--md-surface-variant); border:1px solid var(--md-outline);
  border-radius:var(--radius-full); padding:6px 12px;
  font:500 12.5px 'Google Sans'; color:var(--md-on-surface);
  cursor:pointer; display:inline-flex; align-items:center; gap:6px;
  transition:all .15s;
}
.modal-act-btn:hover{background:var(--md-surface-dim)}
.modal-act-btn .material-symbols-rounded{font-size:17px}
.modal-act-btn.faved{color:#f9ab00; border-color:#f9ab00}
.modal-act-btn.faved .material-symbols-rounded{font-variation-settings:'FILL' 1}
.modal-act-btn.marked{color:var(--md-primary); border-color:var(--md-primary)}
.modal-act-btn.marked .material-symbols-rounded{font-variation-settings:'FILL' 1}

.modal-done-btn, .modal-primary-btn{
  background:var(--md-primary); color:var(--md-on-primary);
  border:0; border-radius:var(--radius-full);
  padding:8px 20px; font:500 13px 'Google Sans';
  cursor:pointer; transition:opacity .15s;
}
.modal-done-btn:hover, .modal-primary-btn:hover{opacity:.9}
.modal-secondary-btn{
  background:transparent; border:1px solid var(--md-outline);
  color:var(--md-on-surface); border-radius:var(--radius-full);
  padding:8px 18px; font:500 13px 'Google Sans';
  cursor:pointer; transition:background .15s;
}
.modal-secondary-btn:hover{background:var(--md-surface-dim)}

/* ============ EDIT & JSON MODAL FORM STYLES ============ */
.edit-dialog{width:min(680px, 100%)}
.edit-form{display:flex; flex-direction:column; gap:16px}
.form-row{display:flex; gap:12px}
.form-row.two-col > div{flex:1}
.form-row.three-col > div:nth-child(2){flex:2}
.form-row.three-col > div:nth-child(3){flex:1.5}
.emoji-col{width:68px; flex-shrink:0}
.form-group{display:flex; flex-direction:column; gap:6px}
.form-group label{font:500 12px 'Google Sans'; color:var(--md-on-surface-variant)}
.form-input, .form-textarea, .form-select{
  background:var(--md-surface-variant);
  border:1px solid var(--md-outline);
  border-radius:var(--radius-sm);
  padding:8px 12px;
  font:400 13.5px 'Google Sans',sans-serif;
  color:var(--md-on-surface);
  outline:none; transition:border-color .2s, box-shadow .2s;
}
.form-input:focus, .form-textarea:focus, .form-select:focus{
  border-color:var(--md-primary);
  box-shadow:0 0 0 2px var(--md-primary-container);
  background:var(--md-surface);
}
.form-textarea{resize:vertical; line-height:1.45}
.form-textarea.code-font{font-family:'Roboto Mono',monospace; font-size:12px}
.img-input-row{display:flex; gap:8px}
.img-input-row input{flex:1}
.form-preview-btn{
  background:var(--md-surface-dim); border:1px solid var(--md-outline);
  border-radius:var(--radius-sm); padding:0 14px;
  font:500 12px 'Google Sans'; color:var(--md-on-surface);
  cursor:pointer;
}
.edit-img-preview-wrap{
  max-height:120px; border-radius:var(--radius-sm); overflow:hidden;
  border:1px solid var(--md-outline-variant); background:var(--md-surface-dim);
  display:none; margin-top:4px;
}
.edit-img-preview-wrap img{width:100%; height:120px; object-fit:cover}

.custom-prompts-section{
  background:var(--md-surface-variant); border:1px solid var(--md-outline-variant);
  border-radius:var(--radius-md); padding:14px;
  display:flex; flex-direction:column; gap:12px;
}
.section-title-sm{
  display:flex; align-items:center; gap:6px;
  font:500 12.5px 'Google Sans'; color:var(--md-on-surface);
}
.section-title-sm .material-symbols-rounded{font-size:16px; color:var(--md-primary)}
.reset-card-btn{color:var(--md-error); border-color:var(--md-error)}
.reset-card-btn:hover{background:rgba(217,48,37,.1)}

/* ============ FOOTER ============ */
footer{
  background:var(--md-surface); border-top:1px solid var(--md-outline);
  padding:20px 24px; text-align:center;
  color:var(--md-on-surface-variant); font-size:12px;
  margin-top:auto;
}
footer a{color:var(--md-primary); text-decoration:none; margin:0 8px}

.sidebar-overlay{
  position:fixed; inset:0; background:rgba(0,0,0,.4);
  opacity:0; pointer-events:none; transition:opacity .2s; z-index:95;
}
.sidebar-overlay.open{opacity:1; pointer-events:auto}

@media(max-width:860px){
  body{flex-direction:column}
  .mobile-topbar{display:flex}
  .left-sidebar{
    position:fixed; top:0; left:0; height:100%;
    transform:translateX(-100%); transition:transform .25s ease;
    box-shadow:var(--md-elev-3);
  }
  .left-sidebar.open{transform:translateX(0)}
  .hero{padding:20px 16px 8px}
  .main-content{padding:8px 16px 40px}
  .grid{grid-template-columns:1fr}
  .specs-grid{grid-template-columns:1fr}
  .form-row{flex-direction:column}
  .emoji-col{width:100%}
}
</style>
</head>

let DATA = JSON.parse(JSON.stringify(RAW_INITIAL_DATA));

// Load user-added custom cards
function loadCustomCards() {
  try {
    const customCards = JSON.parse(localStorage.getItem("vt-custom-cards") || "[]");
    if (Array.isArray(customCards) && customCards.length) {
      customCards.forEach(c => {
        if (c && c.n && !DATA.some(d => d.n === c.n)) {
          DATA.push(c);
        }
      });
    }
  } catch(e) {
    console.warn("Could not load custom cards", e);
  }
}

// Apply saved card modifications from localStorage
function loadSavedCardOverrides() {
  try {
    const overrides = JSON.parse(localStorage.getItem("vt-card-overrides") || "{}");
    Object.entries(overrides).forEach(([id, customFields]) => {
      if (DATA[+id]) {
        Object.assign(DATA[+id], customFields);
      }
    });
  } catch(e) {
    console.warn("Could not load card overrides", e);
  }
}

loadCustomCards();
loadSavedCardOverrides();

let currentTheme = localStorage.getItem("vt-theme") || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");

function applyTheme(theme) {
  currentTheme = theme;
  document.documentElement.setAttribute("data-theme", theme);
  localStorage.setItem("vt-theme", theme);
  const icon = theme === "dark" ? "light_mode" : "dark_mode";
  const themeIcon = $("#themeIcon"), mobileThemeIcon = $("#mobileThemeIcon");
  if (themeIcon) themeIcon.textContent = icon;
  if (mobileThemeIcon) mobileThemeIcon.textContent = icon;
}

function toggleTheme() {
  applyTheme(currentTheme === "dark" ? "light" : "dark");
}

/* ============ COMPONENT LOADER ============ */
async function loadComponent(name, slotId) {
  try {
    const res = await fetch(`components/${name}.html`);
    if (res.ok) {
      const html = await res.text();
      document.getElementById(slotId).innerHTML = html;
      return;
    }
  } catch (e) {
    // Fallback for local protocol restrictions
  }
  document.getElementById(slotId).innerHTML = COMPONENT_FALLBACKS[name] || "";
}

/* ============ IMAGE FALLBACK ============ */
window.ph = img => {
  const n = (img.dataset.n||"ARTIFACT").toUpperCase().slice(0,24);
  const c = img.dataset.c || "#e8eaed";
  const e = img.dataset.e || "🎨";
  img.onerror = null;
  img.src = "data:image/svg+xml," + encodeURIComponent(
    `<svg xmlns='http://www.w3.org/2000/svg' width='640' height='400'>
      <rect width='640' height='400' fill='${c}'/>
      <text x='320' y='200' font-size='100' text-anchor='middle'>${e}</text>
      <text x='320' y='280' font-size='28' font-family='Google Sans,Arial' font-weight='500' text-anchor='middle' fill='#202124'>${n}</text>
    </svg>`
  );
};

/* ============ CARD COMPONENT RENDERER ============ */
let cardTemplateHtml = "";

function renderCard(d, id) {
  const cat = CATS[d.c] || {n:"Uncategorized", c:"#5f6368", tint:"#f1f3f4"};
  const col = cat.c, tint = cat.tint;
  const f = favs.has(d.n), m = marks.has(d.n);
  const imgTag = d.img
    ? `<img loading="lazy" src="${d.img}" data-n="${d.n}" data-c="${col}" data-e="${d.e||'🎨'}" onerror="ph(this)" alt="">`
    : `<img src="" data-n="${d.n}" data-c="${col}" data-e="${d.e||'🎨'}" onerror="ph(this)" alt="">`;

  if (!cardTemplateHtml) {
    const tpl = document.getElementById("card-template");
    cardTemplateHtml = tpl ? tpl.innerHTML : COMPONENT_FALLBACKS["card"];
  }

  return cardTemplateHtml
    .replace(/\{\{id\}\}/g, id)
    .replace(/\{\{color\}\}/g, col)
    .replace(/\{\{tint\}\}/g, tint)
    .replace(/\{\{imageTag\}\}/g, imgTag)
    .replace(/\{\{categoryName\}\}/g, cat.n)
    .replace(/\{\{name\}\}/g, d.n)
    .replace(/\{\{stage\}\}/g, d.s)
    .replace(/\{\{purpose\}\}/g, d.p)
    .replace(/\{\{inputs\}\}/g, d.i)
    .replace(/\{\{outputs\}\}/g, d.o)
    .replace(/\{\{structure\}\}/g, d.st)
    .replace(/\{\{example\}\}/g, d.ex)
    .replace(/\{\{favedClass\}\}/g, f ? 'faved' : '')
    .replace(/\{\{favIcon\}\}/g, f ? 'star' : 'star_border')
    .replace(/\{\{favText\}\}/g, f ? 'Favorited' : 'Favorite')
    .replace(/\{\{markedClass\}\}/g, m ? 'marked' : '')
    .replace(/\{\{markIcon\}\}/g, m ? 'bookmark' : 'bookmark_border')
    .replace(/\{\{markText\}\}/g, m ? 'Saved' : 'Save');
}

function saveEditedCard() {
  if (editingCardId === null) return;
  const id = editingCardId;

  const oldName = DATA[id].n;
  const newName = $("#editName").value.trim() || oldName;

  if (oldName !== newName) {
    if (favs.has(oldName)) { favs.delete(oldName); favs.add(newName); }
    if (marks.has(oldName)) { marks.delete(oldName); marks.add(newName); }
    save();
  }

  const updated = {
    e: $("#editEmoji").value.trim() || "🎨",
    n: newName,
    c: $("#editCategory").value,
    s: $("#editStage").value,
    p: $("#editPurpose").value.trim(),
    img: $("#editImg").value.trim(),
    st: $("#editStructure").value.trim(),
    i: $("#editInputs").value.trim(),
    o: $("#editOutputs").value.trim(),
    ex: $("#editExample").value.trim(),
    customImgPrompt: $("#editCustomImgPrompt").value.trim() || undefined,
    customLlmPrompt: $("#editCustomLlmPrompt").value.trim() || undefined
  };

  Object.assign(DATA[id], updated);

  try {
    const overrides = JSON.parse(localStorage.getItem("vt-card-overrides") || "{}");
    overrides[id] = updated;
    localStorage.setItem("vt-card-overrides", JSON.stringify(overrides));
  } catch(e) {
    console.warn("Could not save card overrides", e);
  }

  closeEditModal();
  render();

  const cardEl = $(`#card-${id}`);
  if (cardEl) {
    cardEl.classList.add("flash");
    setTimeout(() => cardEl.classList.remove("flash"), 900);
  }
}

function resetCardToDefault() {
  if (editingCardId === null) return;
  const id = editingCardId;
  const orig = ORIGINAL_DATA[id];
  if (!orig) return;

  if (confirm(`Reset "${DATA[id].n}" to its original default content?`)) {
    DATA[id] = JSON.parse(JSON.stringify(orig));

    try {
      const overrides = JSON.parse(localStorage.getItem("vt-card-overrides") || "{}");
      delete overrides[id];
      localStorage.setItem("vt-card-overrides", JSON.stringify(overrides));
    } catch(e) {}

    closeEditModal();
    render();
  }
}

function validateJsonInput() {
  const text = $("#jsonInputText").value.trim();
  const errorEl = $("#jsonErrorMsg");
  const previewEl = $("#jsonPreviewSummary");
  const countEl = $("#jsonPreviewCount");

  if (!text) {
    errorEl.textContent = "Please enter a valid JSON object or array.";
    errorEl.style.display = "block";
    previewEl.style.display = "none";
    return null;
  }

  try {
    let parsed = JSON.parse(text);
    if (!Array.isArray(parsed)) parsed = [parsed];

    if (!parsed.length) {
      throw new Error("JSON array is empty.");
    }

    // Validate each card
    for (let i = 0; i < parsed.length; i++) {
      const card = parsed[i];
      if (!card || typeof card !== "object") {
        throw new Error(`Item #${i + 1} is not a valid JSON object.`);
      }
      if (!card.n || typeof card.n !== "string") {
        throw new Error(`Item #${i + 1} is missing a required "n" (name) property.`);
      }
      if (!card.c || !CATS[card.c]) {
        throw new Error(`Item #${i + 1} ("${card.n}") has invalid category "${card.c}". Valid categories: ${Object.keys(CATS).join(", ")}`);
      }
      if (!card.s || !STAGES.includes(card.s)) {
        throw new Error(`Item #${i + 1} ("${card.n}") has invalid stage "${card.s}". Valid stages: ${STAGES.join(", ")}`);
      }
      if (!card.p) card.p = "Visual thinking artifact definition.";
      if (!card.i) card.i = "Project requirements";
      if (!card.o) card.o = "Visual deliverable";
      if (!card.st) card.st = "Visual layout";
      if (!card.ex) card.ex = "Applied project scenario";
      if (!card.e) card.e = "🎨";
    }

    errorEl.style.display = "none";
    countEl.textContent = `${parsed.length} valid artifact${parsed.length > 1 ? 's' : ''}`;
    previewEl.style.display = "block";
    return parsed;
  } catch (err) {
    errorEl.textContent = "JSON Validation Error: " + err.message;
    errorEl.style.display = "block";
    previewEl.style.display = "none";
    return null;
  }
}

function submitJsonCards() {
  const cards = validateJsonInput();
  if (!cards) return;

  const customCards = JSON.parse(localStorage.getItem("vt-custom-cards") || "[]");

  cards.forEach(card => {
    // Check if card already exists, if so update it, else append
    const existingIndex = DATA.findIndex(d => d.n.toLowerCase() === card.n.toLowerCase());
    if (existingIndex >= 0) {
      Object.assign(DATA[existingIndex], card);
    } else {
      DATA.push(card);
      customCards.push(card);
    }
  });

  try {
    localStorage.setItem("vt-custom-cards", JSON.stringify(customCards));
  } catch(e) {
    console.warn("Could not persist custom cards to localStorage", e);
  }

  // Refresh categories counts in sidebar
  refreshSidebarCategories();

  closeJsonModal();
  render();

  // Scroll to and flash the last added card
  const newIndex = DATA.length - 1;
  setTimeout(() => {
    const cardEl = $(`#card-${newIndex}`);
    if (cardEl) {
      cardEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
      cardEl.classList.add("flash");
      setTimeout(() => cardEl.classList.remove("flash"), 1200);
    }
  }, 300);
}

function refreshSidebarCategories() {
  const catCounts = {};
  DATA.forEach(d => { catCounts[d.c] = (catCounts[d.c] || 0) + 1; });

  const totalBadge = $("#totalCountBadge");
  if (totalBadge) totalBadge.textContent = DATA.length;

  $("#sidebarChips").innerHTML =
    `<button class="cat-item ${state.cat==='all'?'active':''}" data-cat="all">
       <i class="dot" style="--c:#5f6368"></i>
       <span class="name">All Categories</span>
       <span class="count">${DATA.length}</span>
     </button>` +
    Object.entries(CATS).map(([k,v]) =>
      `<button class="cat-item ${state.cat===k?'active':''}" data-cat="${k}" style="--cat-color:${v.c}; --cat-tint:${v.tint}; --c:${v.c}">
         <i class="dot" style="--c:${v.c}"></i>
         <span class="name">${v.n}</span>
         <span class="count">${catCounts[k] || 0}</span>
       </button>`
    ).join("");
}

/* ============ MAIN RENDER ============ */
function render(){
  const q = state.q.toLowerCase();
  const list = DATA.map((d,i)=>({d,i})).filter(({d}) => {
    if(state.cat !== "all" && d.c !== state.cat) return false;
    if(state.stage !== "all" && d.s !== state.stage) return false;
    if(state.view === "favs" && !favs.has(d.n)) return false;
    if(state.view === "marks" && !marks.has(d.n)) return false;
    if(q && !(d.n+" "+d.p+" "+d.ex+" "+(CATS[d.c]?.n||"")+" "+d.s).toLowerCase().includes(q)) return false;
    return true;
  });

  $("#grid").innerHTML = list.map(({d,i}) => renderCard(d,i)).join("");
  $("#empty").style.display = list.length ? "none" : "block";
  $("#resultline").textContent = `${list.length} artifact${list.length===1?'':'s'}`;

  // Update filter summary active badges
  let summaryHtml = "";
  if(state.view === "favs") {
    summaryHtml += `<span class="active-tag">Favorites <span class="material-symbols-rounded" onclick="setView('all')">close</span></span>`;
  } else if(state.view === "marks") {
    summaryHtml += `<span class="active-tag">Bookmarks <span class="material-symbols-rounded" onclick="setView('all')">close</span></span>`;
  }
  if(state.cat !== "all") {
    summaryHtml += `<span class="active-tag">${CATS[state.cat]?.n} <span class="material-symbols-rounded" onclick="resetCategory()">close</span></span>`;
  }
  if(state.stage !== "all") {
    summaryHtml += `<span class="active-tag">${state.stage} <span class="material-symbols-rounded" onclick="resetStage()">close</span></span>`;
  }
  $("#filterSummary").innerHTML = summaryHtml;

  // Update sidebar active highlights
  document.querySelectorAll(".nav-item").forEach(el => {
    el.classList.toggle("active", el.dataset.view === state.view);
  });
  document.querySelectorAll(".cat-item").forEach(el => {
    el.classList.toggle("active", el.dataset.cat === state.cat);
  });
  document.querySelectorAll(".stage-chip").forEach(el => {
    el.classList.toggle("active", el.dataset.stage === state.stage);
  });

  // Update badge counts in left sidebar
  const fc = favs.size, mc = marks.size;
  const favBadge = $("#favCountBadge"), markBadge = $("#markCountBadge"), totalBadge = $("#totalCountBadge");
  if(favBadge) favBadge.textContent = fc;
  if(markBadge) markBadge.textContent = mc;
  if(totalBadge) totalBadge.textContent = DATA.length;

  // Render Saved Bookmarks in left sidebar
  renderSidebarBookmarks();

  // If modal is open, sync footer buttons
  updateModalFooterButtons();
}

function renderSidebarBookmarks(){
  const bookmarkList = $("#sidebarBookmarkList");
  if (!bookmarkList) return;
  const items = DATA.filter(d => marks.has(d.n));
  bookmarkList.innerHTML = items.length
    ? items.map(d => {
        const id = DATA.indexOf(d);
        const cat = CATS[d.c] || {c:"#5f6368"};
        return `<div class="b-quick-item" data-id="${id}">
          <i style="--c:${cat.c}"></i>
          <span class="b-name">${d.n}</span>
        </div>`;
      }).join("")
    : `<div class="b-empty">No bookmarks saved yet.</div>`;
}

function setView(viewName){
  state.view = viewName;
  render();
}
function resetCategory(){
  state.cat = "all";
  render();
}
function resetStage(){
  state.stage = "all";
  render();
}

/* ============ CLIPBOARD COPY HELPER ============ */
async function copyToClipboard(text, btn) {
  try {
    await navigator.clipboard.writeText(text);
    btn.classList.add("copied");
    const label = btn.querySelector("span:last-child");
    if (label) label.textContent = "Copied!";
    setTimeout(() => {
      btn.classList.remove("copied");
      if (label) label.textContent = "Copy";
    }, 2000);
  } catch (err) {
    const ta = document.createElement("textarea");
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand("copy");
    document.body.removeChild(ta);
    btn.classList.add("copied");
    const label = btn.querySelector("span:last-child");
    if (label) label.textContent = "Copied!";
    setTimeout(() => {
      btn.classList.remove("copied");
      if (label) label.textContent = "Copy";
    }, 2000);
  }
}

/* ============ INITIALIZE & ATTACH EVENTS ============ */
async function initApp() {
  applyTheme(currentTheme);

  await Promise.all([
    loadComponent("left-sidebar", "left-sidebar-slot"),
    loadComponent("hero", "hero-slot"),
    loadComponent("card-details", "modal-slot"),
    loadComponent("card-edit", "edit-modal-slot"),
    loadComponent("add-json-modal", "json-modal-slot"),
    loadComponent("footer", "footer-slot"),
    loadComponent("card", "card-template-slot")
  ]);

  const tpl = document.getElementById("card-template");
  if (tpl) cardTemplateHtml = tpl.innerHTML;

  refreshSidebarCategories();

  // Build Workflow Stages in Left Sidebar
  $("#sidebarStages").innerHTML =
    `<button class="stage-chip active" data-stage="all" style="grid-column:1/-1">
       <b>*</b><span>All Stages</span>
     </button>` +
    STAGES.map((s, i) =>
      `<button class="stage-chip" data-stage="${s}">
         <b>${i+1}</b><span>${s}</span>
       </button>`
    ).join("");

  // Attach search bar events
  $("#q").addEventListener("input", e => {
    state.q = e.target.value;
    $("#clearBtn").classList.toggle("show", !!state.q);
    render();
  });
  $("#clearBtn").addEventListener("click", () => {
    $("#q").value = ""; state.q = "";
    $("#clearBtn").classList.remove("show");
    render(); $("#q").focus();
  });

  // Keyboard shortcuts
  document.addEventListener("keydown", e => {
    if (e.key === "/" && document.activeElement !== $("#q") && !$("#cardModalBackdrop").classList.contains("open") && !$("#editModalBackdrop").classList.contains("open") && !$("#jsonModalBackdrop").classList.contains("open")) {
      e.preventDefault();
      $("#q").focus();
    }
    if (e.key === "Escape") {
      if ($("#jsonModalBackdrop").classList.contains("open")) {
        closeJsonModal();
      } else if ($("#editModalBackdrop").classList.contains("open")) {
        closeEditModal();
      } else if ($("#cardModalBackdrop").classList.contains("open")) {
        closeModal();
      } else {
        toggleMobileSidebar(false);
      }
    }
  });

  // Theme Toggle Event Handlers
  const themeBtn = $("#themeToggleBtn"), mobileThemeBtn = $("#mobileThemeToggleBtn");
  if (themeBtn) themeBtn.addEventListener("click", toggleTheme);
  if (mobileThemeBtn) mobileThemeBtn.addEventListener("click", toggleTheme);
  applyTheme(currentTheme);

  // Left Sidebar Views
  $("#viewAllBtn").addEventListener("click", () => setView("all"));
  $("#viewFavBtn").addEventListener("click", () => setView("favs"));
  $("#viewMarkBtn").addEventListener("click", () => setView("marks"));

  // Add Card from JSON button
  const openJsonBtn = $("#openJsonModalBtn");
  if (openJsonBtn) openJsonBtn.addEventListener("click", openJsonModal);

  // Sidebar Category & Stage click events
  $("#sidebarChips").addEventListener("click", e => {
    const item = e.target.closest(".cat-item");
    if (!item) return;
    state.cat = item.dataset.cat;
    render();
  });
  $("#sidebarStages").addEventListener("click", e => {
    const item = e.target.closest(".stage-chip");
    if (!item) return;
    state.stage = item.dataset.stage;
    render();
  });

  $("#resetCatBtn").addEventListener("click", resetCategory);
  $("#resetStageBtn").addEventListener("click", resetStage);

  // Quick Bookmarks list click
  $("#sidebarBookmarkList").addEventListener("click", e => {
    const it = e.target.closest(".b-quick-item");
    if (!it) return;
    const id = +it.dataset.id;
    openModal(id);
  });

  // Grid card button actions
  $("#grid").addEventListener("click", e => {
    const cardEl = e.target.closest(".card");
    if (!cardEl) return;
    const id = +cardEl.dataset.id, name = DATA[id].n;

    const actionBtn = e.target.closest("button[data-act]");
    if (actionBtn) {
      const act = actionBtn.dataset.act;
      if (act === "fav") {
        favs.has(name) ? favs.delete(name) : favs.add(name);
        save(); render();
      } else if (act === "mark") {
        marks.has(name) ? marks.delete(name) : marks.add(name);
        save(); render();
      } else if (act === "edit") {
        openEditModal(id);
      } else if (act === "details") {
        openModal(id);
      }
      return;
    }

    const detailsTarget = e.target.closest("[data-act='details']");
    if (detailsTarget) {
      openModal(id);
    }
  });

  // Details Modal event listeners
  $("#modalCloseBtn").addEventListener("click", closeModal);
  $("#modalDoneBtn").addEventListener("click", closeModal);
  $("#modalEditBtn").addEventListener("click", () => {
    if (activeModalId !== null) openEditModal(activeModalId);
  });
  $("#cardModalBackdrop").addEventListener("click", e => {
    if (e.target === $("#cardModalBackdrop")) closeModal();
  });

  $("#modalFavBtn").addEventListener("click", () => {
    if (activeModalId === null) return;
    const name = DATA[activeModalId].n;
    favs.has(name) ? favs.delete(name) : favs.add(name);
    save(); render();
  });
  $("#modalMarkBtn").addEventListener("click", () => {
    if (activeModalId === null) return;
    const name = DATA[activeModalId].n;
    marks.has(name) ? marks.delete(name) : marks.add(name);
    save(); render();
  });

  // Edit Modal Event Listeners
  $("#editModalCloseBtn").addEventListener("click", closeEditModal);
  $("#editCancelBtn").addEventListener("click", closeEditModal);
  $("#editSaveBtn").addEventListener("click", saveEditedCard);
  $("#editResetCardBtn").addEventListener("click", resetCardToDefault);
  $("#editModalBackdrop").addEventListener("click", e => {
    if (e.target === $("#editModalBackdrop")) closeEditModal();
  });

  $("#editImgPreviewBtn").addEventListener("click", () => {
    updateEditImagePreview($("#editImg").value);
  });
  $("#editImg").addEventListener("input", e => {
    updateEditImagePreview(e.target.value);
  });

  // JSON Modal Event Listeners
  $("#jsonModalCloseBtn").addEventListener("click", closeJsonModal);
  $("#jsonCancelBtn").addEventListener("click", closeJsonModal);
  $("#jsonSubmitBtn").addEventListener("click", submitJsonCards);
  $("#jsonValidateBtn").addEventListener("click", validateJsonInput);
  $("#jsonFillTemplateBtn").addEventListener("click", () => {
    $("#jsonInputText").value = JSON_CARD_TEMPLATE;
    validateJsonInput();
  });
  $("#jsonInputText").addEventListener("input", validateJsonInput);
  $("#jsonModalBackdrop").addEventListener("click", e => {
    if (e.target === $("#jsonModalBackdrop")) closeJsonModal();
  });

  // Prompt Copy buttons
  $("#copyImgPromptBtn").addEventListener("click", () => {
    const text = $("#imagePromptText").textContent;
    copyToClipboard(text, $("#copyImgPromptBtn"));
  });
  $("#copyLlmPromptBtn").addEventListener("click", () => {
    const text = $("#llmPromptText").textContent;
    copyToClipboard(text, $("#copyLlmPromptBtn"));
  });

  // Mobile menu open/close
  const toggleMobileSidebar = (open) => {
    $("#leftSidebar").classList.toggle("open", open);
    $("#sidebarOverlay").classList.toggle("open", open);
  };
  $("#mobileMenuBtn").addEventListener("click", () => toggleMobileSidebar(true));
  $("#sidebarOverlay").addEventListener("click", () => toggleMobileSidebar(false));

  render();
}

window.addEventListener("DOMContentLoaded", initApp);
</script>
</body>
